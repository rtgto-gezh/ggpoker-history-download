<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Chrome 版本提示</title>
    <style>
      body {
        margin: 0;
        padding: 40px 20px;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #181c24;
        color: #f3f6fa;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        box-sizing: border-box;
      }
      .container {
        max-width: 600px;
        background: #232936;
        padding: 32px;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      }
      h1 {
        font-size: 24px;
        margin: 0 0 20px;
        color: #f3f6fa;
      }
      p {
        font-size: 16px;
        line-height: 1.6;
        margin: 0 0 24px;
        color: #bfc9d9;
      }
      .version {
        font-size: 18px;
        font-weight: bold;
        color: #f59e42;
        margin: 16px 0;
      }
      .download-btn {
        display: inline-block;
        background: linear-gradient(90deg, #2563eb 0%, #1e40af 100%);
        color: #fff;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: 500;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .download-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      }
      .icon {
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="../icons/icon128.png" alt="GGPoker" class="icon" />
      <h1>需要更新 Chrome 浏览器</h1>
      <p>GGPoker记录下载助手需要 Chrome 114 或更高版本才能使用 Side Panel 功能。</p>
      <div class="version">当前版本：<span id="current-version">检测中...</span></div>
      <p>请更新您的 Chrome 浏览器以获得最佳体验。</p>
      <a href="https://www.google.com/chrome/" target="_blank" class="download-btn">下载最新版 Chrome</a>
    </div>
    <script>
      // 显示当前 Chrome 版本
      const match = navigator.userAgent.match(/Chrome\/(\d+)/);
      const version = match ? match[1] : "未知";
      document.getElementById("current-version").textContent = `Chrome ${version}`;
    </script>
  </body>
</html>
